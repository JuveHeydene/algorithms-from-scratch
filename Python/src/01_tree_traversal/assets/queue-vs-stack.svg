<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="Queue versus stack" font-family="Helvetica, Arial, sans-serif">
<title>Queue versus stack</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-level" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="700" height="320" rx="14" fill="#ffffff"/>
<text x="170" y="30" font-size="15" fill="#7048e8" text-anchor="middle" font-weight="bold" dominant-baseline="central">Queue: first in, first out</text><rect x="80" y="90" width="52" height="52" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="106" y="116" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">A</text><rect x="142" y="90" width="52" height="52" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="168" y="116" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">B</text><rect x="204" y="90" width="52" height="52" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="230" y="116" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">C</text><line x1="70" y1="116" x2="20" y2="116" stroke="#7048e8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-level)"/><text x="45" y="160" font-size="13" fill="#7048e8" text-anchor="middle" font-weight="normal" dominant-baseline="central">out</text><text x="45" y="176" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="central">(front)</text><line x1="330" y1="116" x2="280" y2="116" stroke="#7048e8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-level)"/><text x="305" y="160" font-size="13" fill="#7048e8" text-anchor="middle" font-weight="normal" dominant-baseline="central">in</text><text x="305" y="176" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="central">(back)</text><text x="170" y="220" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="central">Like a line at the bakery:</text><text x="170" y="238" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="central">A arrived first, A is served first.</text><text x="170" y="262" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="central" font-family="Menlo, Consolas, monospace">Python: collections.deque</text><text x="170" y="280" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="central" font-family="Menlo, Consolas, monospace">append() / popleft()</text><line x1="350" y1="20" x2="350" y2="305" stroke="#e2e8f0" stroke-width="2"/><text x="520" y="30" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold" dominant-baseline="central">Stack: last in, first out</text><rect x="470" y="100" width="100" height="38" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="520" y="119" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">C</text><rect x="470" y="144" width="100" height="38" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="520" y="163" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">B</text><rect x="470" y="188" width="100" height="38" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="520" y="207" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">A</text><line x1="500" y1="52" x2="500" y2="92" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="492" y="66" font-size="12" fill="#e8590c" text-anchor="end" font-weight="normal" dominant-baseline="central">push (in)</text><line x1="540" y1="92" x2="540" y2="52" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="548" y="66" font-size="12" fill="#e8590c" text-anchor="start" font-weight="normal" dominant-baseline="central">pop (out)</text><text x="520" y="262" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="central">Like a pile of plates:</text><text x="520" y="280" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="central">C was put last, C is taken first.</text><text x="520" y="302" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="central" font-family="Menlo, Consolas, monospace">Python: list   append() / pop()</text>
</svg>
