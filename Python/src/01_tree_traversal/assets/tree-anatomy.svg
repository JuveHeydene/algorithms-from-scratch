<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-label="Anatomy of a binary tree" font-family="Helvetica, Arial, sans-serif">
<title>Anatomy of a binary tree</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-level" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="640" height="430" rx="14" fill="#ffffff"/>
<rect x="28" y="108" width="285" height="226" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="355" y="108" width="180" height="226" rx="16" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="170" y="352" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold" dominant-baseline="central">left subtree of F</text><text x="445" y="352" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="bold" dominant-baseline="central">right subtree of F</text><line x1="335" y1="60" x2="115" y2="140" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><line x1="335" y1="60" x2="390" y2="140" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><line x1="115" y1="140" x2="60" y2="220" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><line x1="115" y1="140" x2="225" y2="220" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><line x1="390" y1="140" x2="500" y2="220" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><line x1="225" y1="220" x2="170" y2="300" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><line x1="225" y1="220" x2="280" y2="300" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><line x1="500" y1="220" x2="445" y2="300" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><circle cx="335" cy="60" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="335" y="60" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">F</text><circle cx="115" cy="140" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="115" y="140" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">B</text><circle cx="390" cy="140" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="390" y="140" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">G</text><circle cx="60" cy="220" r="20" fill="#ebfbee" stroke="#1f2937" stroke-width="2"/><text x="60" y="220" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">A</text><circle cx="225" cy="220" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="225" y="220" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">D</text><circle cx="500" cy="220" r="20" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="500" y="220" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">I</text><circle cx="170" cy="300" r="20" fill="#ebfbee" stroke="#1f2937" stroke-width="2"/><text x="170" y="300" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">C</text><circle cx="280" cy="300" r="20" fill="#ebfbee" stroke="#1f2937" stroke-width="2"/><text x="280" y="300" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">E</text><circle cx="445" cy="300" r="20" fill="#ebfbee" stroke="#1f2937" stroke-width="2"/><text x="445" y="300" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="central">H</text><text x="370" y="50" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="central">root: the single top node</text><text x="560" y="60" font-size="13" fill="#7048e8" text-anchor="start" font-weight="bold" dominant-baseline="central">level 0</text><text x="560" y="140" font-size="13" fill="#7048e8" text-anchor="start" font-weight="bold" dominant-baseline="central">level 1</text><text x="560" y="220" font-size="13" fill="#7048e8" text-anchor="start" font-weight="bold" dominant-baseline="central">level 2</text><text x="560" y="300" font-size="13" fill="#7048e8" text-anchor="start" font-weight="bold" dominant-baseline="central">level 3</text><circle cx="60" cy="385" r="9" fill="#ebfbee" stroke="#1f2937" stroke-width="2"/><text x="76" y="385" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="central">leaf: a node with no children (A, C, E, H)</text><text x="76" y="410" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="central">edge: the link between a parent and its child (F is the parent of B and G)</text><line x1="44" y1="410" x2="64" y2="410" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
